<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الخطة التشغيلية 2026م — جمعية إعمار المرافق</title>
<link rel="icon" href="assets/img/logo.png" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="page-shell">

  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-mark"><img src="assets/img/logo.png" alt="شعار جمعية إعمار المرافق" /></div>
      <div class="topbar-divider"></div>
      <div class="topbar-title">
        <h1>الخطة التشغيلية 2026م</h1>
        <div class="sub">جمعية إعمار المرافق</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="sync-status"></span>
      <span class="last-update">آخر تحديث: <span id="last-update"></span></span>
      <button class="btn btn-primary" id="refresh-btn">↻ تحديث</button>
      <button class="btn" id="theme-toggle">🌓</button>
      <button class="btn" id="print-btn">🖨️ طباعة</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-link active" data-view="view-overview">نظرة عامة</button>
    <button class="tab-link" data-view="view-projects">المبادرات والمشاريع</button>
  </nav>

  <!-- نظرة عامة -->
  <section class="view active" id="view-overview">
    <div class="grid grid-4" id="kpi-grid"></div>

    <div class="card" style="margin-top:16px">
      <h3>ملخص الأبعاد الاستراتيجية</h3>
      <span class="card-note">عدد المبادرات، إجمالي التكلفة، ونسبة الإنجاز لكل بُعد استراتيجي</span>
      <div class="goal-grid" id="perspective-summary"></div>
      <div class="card-note" style="margin-top:12px; margin-bottom:0" id="budget-concentration-note"></div>
    </div>
  </section>

  <!-- المبادرات -->
  <section class="view" id="view-projects">
    <div class="card">
      <div class="table-toolbar">
        <h3 style="margin:0">المبادرات والمشاريع</h3>
        <div class="table-controls">
          <input id="search-input" class="search-input" placeholder="ابحث بالاسم أو المؤشر أو المسؤول" />
          <select id="perspective-select" class="select-input">
            <option value="">كل الأبعاد الاستراتيجية</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>البعد الاستراتيجي</th><th>المبادرة</th><th>الحالة</th><th>نسبة الإنجاز</th>
              <th>المؤشر</th><th>الميزانية</th><th>المسؤول</th><th>حالة الدعم</th>
            </tr>
          </thead>
          <tbody id="projects-tbody"></tbody>
        </table>
      </div>
    </div>
  </section>

</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/sheet-sync.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
